{# Circular progress ring (like the template's 'Month Progress' and project rings). #}
<svg class="ring{% if small %} ring-sm{% endif %}" viewBox="0 0 100 100" role="img" aria-label="{{ ring.percent }} percent">
  <circle cx="50" cy="50" r="40" class="ring-track"/>
  <circle cx="50" cy="50" r="40" class="ring-bar" stroke-dasharray="{{ ring.dash }} {{ ring.circ }}" transform="rotate(-90 50 50)"/>
  <text x="50" y="50" class="ring-text" dominant-baseline="central" text-anchor="middle">{{ ring.percent }}%</text>
</svg>
